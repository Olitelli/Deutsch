<script>
const stations = {
"1": {"title":"Die Schule","next":"2","hint":"Suche die Bank unter dem großen Baum.","easy":"Alle warten auf den Laternenumzug. Bens goldene Sternenlaterne fehlt. Ein rotes Band flattert vom Tor zum großen Baum. Darunter steht eine Bank. Suche sie!","medium":"Auf dem Schulhof warten die Kinder auf den Laternenumzug. Nur Ben ist traurig: Seine goldene Sternenlaterne fehlt. Mia entdeckt am Tor ein schmales rotes Band. Es flattert im Wind und bleibt schließlich an einer Bank unter einer großen Linde hängen. Dort muss sie nachsehen.","hard":"Kurz vor dem Start bemerkt Ben, dass seine goldene Sternenlaterne verschwunden ist. Mia untersucht den Schulhof. Ein schmales rotes Band, das wohl an der Laterne befestigt war, flattert vom Tor aus in Richtung des großen Baumes. Direkt darunter steht eine Sitzgelegenheit. Welche Station passt zu beiden Hinweisen?"},
"2": {"title":"Die Bank unter der Linde","next":"4","hint":"Suche das Wasser, auf dem zwei Enten schwimmen.","easy":"Ein goldenes Sternstück liegt unter der Bank. Der Wind trägt weitere Stücke zum Teich. Dort schwimmen Enten. Suche den Teich!","medium":"Mia findet unter der Bank einen kleinen goldenen Papierschnipsel. Er hat eine gezackte Kante wie ein Stern. Ein zweites Stück liegt auf dem Weg und zeigt in Richtung des Teiches, auf dem Enten schwimmen. Mia folgt der Spur.","hard":"Zwischen den Holzlatten der Bank steckt ein winziger goldener Papierschnipsel. Seine gezackte Form erinnert an einen Stern. Ein weiterer Fetzen liegt ein paar Schritte weiter und wurde offenbar vom Wind bis zum Wasser getragen. Dort ziehen Enten ihre Kreise. Suche diesen Ort."},
"3": {"title":"Die Kirche","next":null,"hint":"Die Spur führt nicht zum Kirchturm. Lies den Hinweis bei der Bank noch einmal.","easy":"Vor der Kirche ist es ganz still. Hier liegt kein goldenes Papier. Das ist nicht die richtige Spur. Lies den Hinweis noch einmal.","medium":"Mia schaut auf den Stufen der Kirche nach. Sie entdeckt weder goldenes Papier noch eine Spur von Wachs. Auch die Richtung vom großen Baum passt nicht. Sie muss an einer anderen Station weitersuchen.","hard":"Der Kirchturm ist weithin zu sehen, doch an der Kirche findet Mia nichts, das zu den gezackten goldenen Papierschnipseln passt. Die Hinweise von der Bank zeigen zum Wasser und nicht zum Kirchplatz."},
"4": {"title":"Der Ententeich","next":"5","hint":"Suche den überdachten Pavillon mit den leuchtenden Laternen.","easy":"Am Teich liegt ein Wachstropfen. Die Enten schwimmen daneben. Fußspuren führen zum überdachten Pavillon. Dort leuchten Laternen. Suche ihn!","medium":"Am Ufer entdeckt Mia einen kleinen Tropfen Wachs und ein weiteres Stück goldenes Papier. Im feuchten Boden sind Fußspuren zu sehen. Sie führen zu einem überdachten Pavillon, in dem mehrere Laternen leuchten.","hard":"Neben dem Teich findet Mia einen Wachstropfen. Zusammen mit dem goldenen Papierschnipsel ist das ein wichtiger Hinweis: Hier muss die Laterne kurz abgestellt worden sein. Fußspuren führen zu einem überdachten Treffpunkt, in dem warmes Laternenlicht zu sehen ist."},
"5": {"title":"Der Laternenpavillon","next":"7","hint":"Suche den alten Torbogen aus Stein am unteren Rand der Karte.","easy":"Eine Helferin sah Ben in blauer Jacke. Er ging zu einem alten Steintor, um dort seine Freunde zu treffen. Suche den Torbogen!","medium":"Im Pavillon spricht Mia eine Helferin an. Sie hat Ben mit seiner blauen Jacke gesehen. Er trug etwas Goldenes und ging zu einem alten Torbogen aus Stein. Dort wollte er auf seine Freunde warten. Mia macht sich auf den Weg.","hard":"Eine Helferin erinnert sich an Ben: Er hielt etwas Goldenes in der Hand und wollte sich an einem alten steinernen Durchgang mit seinen Freunden treffen. Auf der Karte ist dieser Torbogen am Rand des Dorfes zu finden."},
"6": {"title":"Das Wohnhaus","next":null,"hint":"Die Helferin beschrieb einen alten Torbogen aus Stein, kein Wohnhaus.","easy":"Vor dem Haus steht ein Fahrrad. Aber Ben ist nicht hier. Lies den Hinweis vom Pavillon noch einmal.","medium":"Mia fragt am Wohnhaus nach. Niemand hat Ben gesehen. Auch eine goldene Laterne ist nicht zu entdecken. Die Beschreibung der Helferin passt zu einem anderen Ort.","hard":"Das Wohnhaus liegt zwar am Weg, doch weder die Bewohner noch der Garten geben einen Hinweis auf Ben. Gesucht ist kein Zuhause, sondern der steinerne Durchgang, den die Helferin beschrieben hat."},
"7": {"title":"Der alte Torbogen","next":"9","hint":"Suche den Holzschuppen am Waldrand.","easy":"Am Torbogen liegt ein Stück goldenes Papier. Dahinter führen Fußspuren zu einem kleinen Holzschuppen am Waldrand. Suche den Schuppen!","medium":"Am steinernen Torbogen entdeckt Mia einen weiteren goldenen Papierschnipsel. Im Laub dahinter sind frische Fußspuren zu sehen. Sie führen zu einem kleinen Holzschuppen am Waldrand.","hard":"Direkt unter dem Torbogen liegt ein letzter goldener Papierschnipsel. Die Fußspuren dahinter verlaufen nicht zurück ins Dorf, sondern zum einzigen Gebäude am Waldrand: einem kleinen Schuppen aus Holz."},
"8": {"title":"Die Mauer mit der Katze","next":null,"hint":"Die Fußspuren führen weiter zum Holzschuppen am Waldrand.","easy":"Auf der Mauer liegt eine Katze und schläft. Von Ben ist nichts zu sehen. Folge den Fußspuren weiter zum Holzschuppen.","medium":"Mia entdeckt eine orange Katze auf der Mauer. Sie schnurrt gemütlich, doch von Ben oder seiner Laterne fehlt jede Spur. Im Laub sind weiterhin Fußspuren zu erkennen, die zum Holzschuppen führen.","hard":"Die Katze auf der Mauer hat offenbar niemanden bemerkt. Weder Papier noch Wachs sind hier zu finden. Die eindeutige Spur sind die Fußabdrücke im Laub, die vom Torbogen aus zum Holzschuppen weiterlaufen."},
"9": {"title":"Der Holzschuppen – gefunden!","next":null,"hint":"Geschafft! Du hast Bens Sternenlaterne gefunden.","easy":"Im Holzschuppen steht Ben. Seine goldene Sternenlaterne hängt sicher am Haken. Der Wind hätte sie draußen fast umgeworfen. Nun kann der Laternenumzug beginnen. Geschafft!","medium":"Im Holzschuppen entdeckt Mia Ben. Seine goldene Sternenlaterne hängt an einem Haken. Der Wind hatte sie am Torbogen beinahe umgeworfen. Ben brachte sie schnell in den Schuppen, damit sie nicht kaputtgeht. Erleichtert nimmt Mia ihn mit zurück zum Umzug.","hard":"Im Schuppen wartet Ben neben seiner goldenen Sternenlaterne. Er erklärt, dass eine kräftige Windböe sie am Torbogen beinahe zu Boden gerissen hätte. Um sie zu schützen, brachte er sie in den Schuppen und wollte anschließend die anderen holen. Mia hat die Hinweise richtig zusammengesetzt – der Umzug kann beginnen!"}
};

const fourthHints={"1":"Mia denkt über Band, Windrichtung und Sitzplatz nach. Zusammen weisen die Hinweise zu einer Bank unter einem Baum.","2":"Die gezackten goldenen Stücke stammen vom Stern der Laterne. Der Wind trägt sie ans Wasser, wo Enten schwimmen.","3":"An der Kirche fehlen Papier und Wachs. Die Spur der goldenen Zacken führt vom Baum zum Wasser, nicht zum Kirchturm.","4":"Wachs und goldenes Papier deuten auf die Laterne. Fußabdrücke führen von dort zu einem überdachten Ort mit Licht.","5":"Die Helferin beschreibt Ben und sein Ziel. Gesucht ist ein steinerner Durchgang am Dorfrand, keine Wohnung.","6":"Die Beschreibung nennt keinen Innenraum, sondern einen alten Durchgang aus Stein, an dem Ben warten wollte.","7":"Der letzte goldene Schnipsel und die Fußabdrücke führen aus dem Dorf hinaus zu einem kleinen Gebäude aus Holz.","8":"Die Katze ist nur eine Ablenkung. Weder Wachs noch Papier sind dort; die Fußspuren laufen vom Torbogen weiter.","9":"Ben brachte die Laterne vor dem Wind in Sicherheit. Am Haken im Schuppen kann sie nicht umfallen und der Umzug kann starten."};
const middleHints={"1":"Mia prüft, wo das Band beginnt und wo es endet. Es führt nicht direkt zu einer Tür oder einem Fenster. Der große Baum steht am Rand des Schulhofs, und seine Äste reichen über einen Platz, an dem Menschen sitzen können.","2":"Die kleinen goldenen Schnipsel haben gezackte Ränder. Mia erkennt, dass sie von einem Stern stammen könnten. Ein Windstoß trägt sie weg von der Bank. Auf dem Wasser sieht sie zwei Enten, die zwischen den Schilfpflanzen schwimmen.","3":"Mia schaut noch einmal genau auf die Karte. Am Kirchturm und auf den Stufen findet sie weder goldene Papierstücke noch Wachs. Die Bank unter der Linde liegt in einer anderen Richtung. Sie muss den Hinweis dort erneut lesen.","4":"Mia sieht, dass der Wachstropfen frisch ist. Ein kleines goldenes Papier liegt daneben. Die Spur führt nicht weiter über das offene Wasser, sondern zu einem Treffpunkt, dessen Dach Schutz vor Wind bietet und in dem mehrere Laternen leuchten.","5":"Die Helferin erinnert sich an Bens blaue Jacke und daran, dass er etwas Goldenes trug. Sie beschreibt einen alten Durchgang aus Stein, der am unteren Rand des Dorfes steht. Mia sucht auf der Karte nach einem Torbogen und nicht nach einem Haus.","6":"Mia fragt die Bewohner, aber niemand hat Ben gesehen. Im Garten liegen keine goldenen Papierschnipsel und auch kein Wachs. Die Helferin im Pavillon hatte einen steinernen Durchgang beschrieben. Diese Beschreibung passt nicht zum Wohnhaus.","7":"Unter dem Torbogen findet Mia einen goldenen Schnipsel. Im Laub dahinter sind frische Fußabdrücke. Sie führen weg vom Dorf und enden noch nicht. Mia folgt ihnen bis zu einem kleinen Gebäude aus Holz am Waldrand.","8":"Mia entdeckt die orange Katze auf der Mauer. Sie schläft und trägt keine Laterne. Auf dem Boden sieht Mia keine goldenen Stücke, aber im Laub verlaufen Fußspuren weiter. Sie führen vom Torbogen in Richtung Waldrand.","9":"Im Schuppen hängt Bens Laterne geschützt an einem Haken. Der Wind hatte sie draußen beinahe umgestoßen. Ben wollte verhindern, dass sie zerbricht. Mia kann ihn nun beruhigen: Die Sternenlaterne ist heil, und der Umzug kann beginnen."};
const middleTail={"1":"","2":"","3":" Mia vergleicht die Richtung des Windes mit dem Weg vom Baum zum Wasser.","4":" Mia folgt den Fußspuren bis zum Ort, an dem die Laternen leuchten.","5":" Sie sucht genau nach dem beschriebenen steinernen Durchgang.","6":" Mia erinnert sich an die Helferin und prüft, ob deren Beschreibung zu diesem Haus passt.","7":" Mia folgt den Spuren weiter und achtet darauf, ob sie ins Dorf zurückführen oder zum Waldrand hinaus.","8":" Mia lässt sich von der schlafenden Katze nicht ablenken. Sie folgt der Spur aus dem Laub weiter.","9":""};
const mediumTail={"1":"","2":" Mia folgt dem Wind.","3":" Mia kehrt zurück und liest die Bankspur erneut.","4":" Mia folgt den Fußspuren zum überdachten Treffpunkt mit Licht.","5":" Sie sucht nun den Torbogen.","6":" Mia erinnert sich genau an den steinernen Durchgang, den die Helferin beschrieben hat, und sucht ihn auf der Karte.","7":" Mia folgt den Abdrücken vom Torbogen weiter, bis sie an einem kleinen hölzernen Gebäude am Waldrand enden.","8":" Mia folgt den Spuren bis zum Holzschuppen am Waldrand.","9":" Ben wartet dort."};
function storyFor(s,id){if(level===1)return s.easy;if(level===2)return s.medium+mediumTail[id];const longer=s.hard+' '+middleHints[id]+middleTail[id];if(level===3)return longer;return longer+' '+fourthHints[id]+' Mia vergleicht die Beobachtungen mit der Karte und schließt falsche Möglichkeiten aus. Sie wählt den Ort, der alle wichtigen Hinweise erklärt. Welcher Ort passt zu allem?';}
function show(id){const s=stations[id];current=String(id);$('stationLabel').textContent='Station '+id;$('stationTitle').textContent=s.title;$('story').textContent=storyFor(s,id);$('feedback').textContent=id==='9'?'🎉 Geschafft! Bens Sternenlaterne ist wieder da. Der Laternenumzug kann beginnen!':'Lies den Hinweis genau und suche die passende Station auf der Karte.';$('feedback').style.background=id==='9'?'#edf7ed':'#f4f7f1';if(!visited.includes(current))visited.push(current);$('progress').style.width=(visited.length/6*100)+'%';$('status').textContent='Dein Weg: '+visited.join(' → ');}
document.querySelectorAll('.hotspot').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.id;if(!level){$('feedback').textContent='Wähle zuerst eine Stufe.';return;}if(current===null&&id!=='1'){$('feedback').textContent='Beginne zuerst bei Station 1 bei der Schule.';return;}if(current===null&&id==='1'){show(id);return;}if(id===stations[current].next){show(id);}else{$('stationLabel').textContent='Station '+id+' – prüfe deine Spur';$('stationTitle').textContent=stations[id].title;$('story').textContent=storyFor(stations[id],id);$('feedback').textContent=level===1?'Das ist noch nicht die richtige Spur. '+stations[id].hint:'Das ist noch nicht die richtige Spur. Lies den Hinweis erneut und vergleiche die Merkmale mit der Karte.';}}));
function setLevel(l){level=Number(l);document.querySelectorAll('.level').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.level)===level)));if(current)$('story').textContent=storyFor(stations[current],current);else $('story').textContent='Stufe '+level+' gewählt. Beginne bei Station 1 bei der Schule.';}
document.querySelectorAll('.level').forEach(b=>b.addEventListener('click',()=>setLevel(b.dataset.level)));
$('back').onclick=()=>{if(current){$('stationLabel').textContent='Weiter geht’s';$('stationTitle').textContent='Lies den letzten Hinweis noch einmal';$('story').textContent=storyFor(stations[current],current);$('feedback').textContent='Suche nun die Station, die im Hinweis beschrieben wird.';}};
$('restart').onclick=()=>{current=null;visited=[];level=0;document.querySelectorAll('.level').forEach(b=>b.setAttribute('aria-pressed','false'));$('stationLabel').textContent='Start';$('stationTitle').textContent='Wo ist Bens Laterne?';$('story').textContent='Wähle zuerst eine Stufe. Danach beginnt deine Suche bei Station 1.';$('feedback').textContent='Du kannst die Stufe während der Suche wechseln.';$('progress').style.width='0%';$('status').textContent='Dein Weg: Noch keine Station gelesen.';};
</script></body></html>
