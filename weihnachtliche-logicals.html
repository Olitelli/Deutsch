const KEY="logicalWerkstatt_v2";

}
function renderGradePicker(){
 let out=`<section class="hero"><div class="decor">🎄</div><h1>Willkommen bei den<br>Weihnachtlichen Logicals!</h1><p>Wähle zuerst deine Jahrgangsstufe. Danach warten fünf Rätsel auf dich. Jedes gelöste Rätsel öffnet das nächste.</p></section><h2>In welcher Klasse bist du?</h2><div class="grade-grid">`;
 for(let g=1;g<=4;g++){let n=gradeProgress(g);out+=`<article class="grade-card"><div class="tag">5 Rätsel</div><h3>${g}. Klasse</h3><p>${["Einfache Hinweise und erste Zuordnungen.","Hinweise kombinieren und erste Schlussfolgerungen ziehen.","Mehrere Informationen verbinden und mehrstufig denken.","Anspruchsvolle Kombinationen mit fünf bis sechs Elementen."][g-1]}</p><div class="muted">${n} von 5 gelöst</div><div class="progress"><i style="width:${n/5*100}%"></i></div><button onclick="selectGrade(${g})">Klasse ${g} auswählen</button></article>`}
 out+=`</div><h2>Was ist ein Logical?</h2><section class="panel"><p>Ein Logical ist ein Rätsel, bei dem du Hinweise genau lesen und miteinander verbinden musst. Schritt für Schritt findest du so die richtige Lösung.</p></section>`;
 document.getElementById("app").innerHTML=out;
}
function selectGrade(g){selectedGrade=g;home()}
function changeGrade(){selectedGrade=null;home()}
function kind(k){return k==="zuordnung"?"Zuordnen":k==="anmalen"?"Anmalen":"Platzieren"}
function start(id){let p=PUZZLES.find(x=>x.id===id);if(!p||(!isOpen(p)&&!isDone(p)))return;active=p;selectedColor=null;tipIndex=0;document.getElementById("topHome").style.display="inline-block";renderTask()}
function renderTask(){
 let p=active,out=`<button class="ghost small" onclick="home()">← Zurück zur Übersicht</button><section class="panel"><div class="task-head"><div><span class="tag">Klasse ${p.grade} · Rätsel ${list(p.grade).findIndex(x=>x.id===p.id)+1} von 5</span><h1>${p.title}</h1></div><span class="tag">${kind(p.kind)}</span></div><p class="intro">${p.intro}</p><div class="instruction"><b>Deine Aufgabe:</b> ${p.instruction}</div><h3>🔎 Deine Hinweise</h3><ol class="clues">${p.clues.map(c=>`<li>${c}</li>`).join("")}</ol><div class="workarea"><h3>🧩 Deine Lösungsfläche</h3>${workarea(p)}</div><div class="actions"><button onclick="check()">Lösung überprüfen</button><button class="secondary" onclick="tip()">💡 Tipp</button><button class="ghost" onclick="reset()">Neu beginnen</button></div><div id="feedback" class="feedback"></div><div id="tipbox" class="tipbox"></div><div id="complete" class="complete"><h3>🎉 Geschafft!</h3><div id="earned" class="stars"></div><p id="nextText"></p><button onclick="home()">Zur Übersicht</button></div></section>`;
 document.getElementById("app").innerHTML=out;
}
function workarea(p){
 if(p.kind==="zuordnung")return p.items.map((x,i)=>`<div class="assignment-row"><label>${x}</label><select id="a${i}"><option value="">Bitte auswählen …</option>${p.options.map(o=>`<option>${o}</option>`).join("")}</select></div>`).join("");
 if(p.kind==="anmalen")return `<div class="palette">${p.options.map((o,i)=>`<button class="swatch" title="${o}" aria-label="${o}" style="background:${paintColor(o)}" onclick="choose('${o}',this)"></button>`).join("")}</div><p class="muted">Wähle eine Farbe und tippe auf das passende Feld.</p><div class="paint-grid">${p.items.map((x,i)=>`<button class="paint-item" onclick="paint(${i})"><span class="paint-shape" id="shape${i}">✦</span><b>${x}</b><small id="plabel${i}" class="muted">Farbe wählen</small></button>`).join("")}</div>`;
 return `<div class="place-list">${p.items.map((x,i)=>`<div class="place-slot"><strong>${i+1}</strong><select id="a${i}"><option value="">Wer steht hier?</option>${p.items.map(y=>`<option>${y}</option>`).join("")}</select></div>`).join("")}</div>`;
}
function paintColor(name){return ({Gold:"#d8a63b",Rot:"#c94f46",Blau:"#6b9fc6",Grün:"#57936a",Gelb:"#e4c34d",Lila:"#9875b5",Silber:"#b9c0c7",Orange:"#df8c42",Creme:"#f1e6c8"})[name]||"#aaa"}
function choose(c,el){selectedColor=c;document.querySelectorAll(".swatch").forEach(x=>x.classList.remove("selected"));el.classList.add("selected")}
function paint(i){if(!selectedColor){feedback("try","Wähle zuerst eine Farbe aus.");return}let s=document.getElementById("shape"+i);s.style.background=paintColor(selectedColor);s.dataset.color=selectedColor;document.getElementById("plabel"+i).textContent=selectedColor}
function answers(){if(active.kind==="anmalen")return active.items.map((_,i)=>document.getElementById("shape"+i).dataset.color||"");return active.items.map((_,i)=>document.getElementById("a"+i).value)}
function feedback(type,msg){let f=document.getElementById("feedback");f.className="feedback "+type;f.textContent=msg}
function check(){
 let p=active,a=answers(),ok=a.length===p.answer.length&&a.every((v,i)=>v===p.answer[i]);
 if(ok){let s=gradeState(p.grade);if(!s.done[p.id]){s.attempts[p.id]=(s.attempts[p.id]||0)+1;s.stars[p.id]=s.attempts[p.id]===1?3:s.attempts[p.id]===2?2:1;s.done[p.id]=true;save()}
 feedback("good","Richtig! Du hast die Hinweise clever kombiniert. Prima gemacht!");
 document.getElementById("complete").classList.add("show");let n=s.stars[p.id]||1;document.getElementById("earned").textContent="★".repeat(n)+"☆".repeat(3-n);
 let arr=list(p.grade),i=arr.findIndex(x=>x.id===p.id);document.getElementById("nextText").textContent=i===4?"Du hast alle fünf Rätsel deiner Klasse gelöst. Herzlichen Glückwunsch!": "Das nächste Rätsel deiner Klasse ist jetzt freigeschaltet.";
 }else{let s=gradeState(p.grade);if(!s.done[p.id]){s.attempts[p.id]=(s.attempts[p.id]||0)+1;save()}feedback("try","Das stimmt noch nicht ganz. Lies deine Hinweise noch einmal genau. Du schaffst das!");document.getElementById("complete").classList.remove("show")}
}
function tip(){let t=active.tips[Math.min(tipIndex,active.tips.length-1)];let b=document.getElementById("tipbox");b.textContent="💡 Tipp: "+t;b.classList.add("show");if(tipIndex<active.tips.length-1)tipIndex++}
function reset(){if(active.kind==="anmalen")active.items.forEach((_,i)=>{let s=document.getElementById("shape"+i);s.style.background="white";delete s.dataset.color;document.getElementById("plabel"+i).textContent="Farbe wählen"});else active.items.forEach((_,i)=>document.getElementById("a"+i).value="");document.getElementById("feedback").className="feedback";document.getElementById("complete").classList.remove("show")}
home();
</script></body></html>
