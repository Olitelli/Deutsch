<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Die Logical-Werkstatt</title><style>
:root{--bg:#f5f6f3;--ink:#25343b;--muted:#617079;--teal:#267c78;--line:#dce5df}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:17px/1.5 system-ui,'Trebuchet MS',sans-serif;color:var(--ink)}button,select{font:inherit}button{cursor:pointer}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}header>div{max-width:1100px;margin:auto;padding:13px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:850;font-size:1.14rem}.count{font-size:.83rem;color:var(--muted);background:#eef4f1;border-radius:30px;padding:7px 12px}main{max-width:1100px;margin:auto;padding:24px 18px 70px}.hero{background:#e9f2eb;border-radius:25px;padding:30px;display:flex;align-items:center;justify-content:space-between;gap:25px}.hero h1{font-size:clamp(2rem,5vw,3.3rem);letter-spacing:-.05em;line-height:1.1;margin:5px 0 12px}.hero p{max-width:590px;color:#4c6261;margin:0}.art{font-size:clamp(60px,10vw,115px);white-space:nowrap}h2{letter-spacing:-.025em} .levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.level,.paper{background:white;border:1px solid var(--line);border-radius:20px;padding:21px;box-shadow:0 6px 22px #25343b0a}.level h3{margin:0}.level p{margin:4px 0 17px;color:var(--muted);font-size:.9rem}.level-head{display:flex;align-items:center;justify-content:space-between}.level-num{display:grid;place-items:center;width:39px;height:39px;background:#e7f3ef;color:#216a60;border-radius:12px;font-weight:900}.task{display:flex;align-items:center;justify-content:space-between;text-align:left;width:100%;gap:12px;border:1px solid var(--line);background:#fbfcfb;border-radius:12px;padding:11px 13px;margin-top:8px;color:var(--ink)}.task:hover,.task:focus-visible{border-color:#83aaa0;background:#f2faf5}.task small{display:block;color:var(--muted)}.stars{color:#c88c28;white-space:nowrap}.back{background:none;border:0;color:var(--teal);font-weight:800;margin:0 0 16px;padding:8px 0}.meta{color:var(--teal);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;font-weight:850}.paper h1{margin:4px 0 10px;font-size:clamp(1.6rem,4vw,2.4rem)}.intro{background:#eff7f3;padding:15px;border-radius:12px}.columns{display:grid;grid-template-columns:.9fr 1.1fr;gap:18px;margin-top:20px}.clues{background:#fcfaf4;border:1px solid #eee7d8;border-radius:15px;padding:18px}.clues h3,.work h3{margin:0 0 12px}.clues ol{padding-left:24px;margin:0}.clues li{margin:0 0 11px;padding-left:3px}.clues li.emph{background:#ffefbb;border-radius:7px}.work{border:1px solid var(--line);padding:18px;border-radius:15px}.row{display:grid;grid-template-columns:1fr 1.2fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row label{font-weight:750}select{width:100%;min-height:46px;border:1px solid #ccd8d2;border-radius:10px;background:white;padding:8px;color:var(--ink)}.paint{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.paint-cell{text-align:center;border:1px solid var(--line);border-radius:13px;padding:10px}.paint-svg{width:100%;max-width:140px;height:95px;display:block;margin:0 auto 8px}.paint-cell strong{display:block;margin-bottom:8px;font-size:.9rem}.palette{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.swatch{border:2px solid transparent;border-radius:11px;padding:8px 12px;min-height:44px;font-weight:750}.swatch.active{outline:3px solid var(--teal);outline-offset:2px}.paint-target{border:2px solid #d4ddd8;background:#fff;border-radius:12px;width:100%;padding:8px;min-height:120px}.paint-target:focus-visible{outline:3px solid var(--teal)}.places{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.place{min-height:100px;border:2px dashed #b9ccc4;border-radius:13px;background:#f7faf8;padding:7px;color:var(--ink);font-weight:800}.place small{display:block;color:var(--muted);font-weight:600}.tokens{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.token{background:#fff;border:1px solid #b9ccc4;border-radius:100px;padding:10px 14px;font-weight:750;color:var(--ink)}.token.active{background:var(--teal);color:#fff}.token.used{opacity:.5}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}.primary,.secondary{border-radius:12px;padding:12px 17px;font-weight:800;min-height:48px}.primary{background:var(--teal);border:1px solid var(--teal);color:white}.secondary{background:white;border:1px solid #cddbd3;color:#375b57}.feedback{margin-top:15px;border-radius:12px;padding:13px 16px;font-weight:700}.feedback.bad{background:#fff1df;color:#805a27}.feedback.good{background:#e9f5e9;color:#386c41}.win{text-align:center;padding:32px 12px}.win .big{font-size:3rem;color:#c88c28;letter-spacing:4px}.win h2{font-size:2rem;margin:10px 0}.win p{color:var(--muted)}.hint{font-size:.9rem;color:var(--muted)}@media(max-width:760px){.levels,.columns{grid-template-columns:1fr}.hero{padding:22px}.art{display:none}.places{grid-template-columns:repeat(2,1fr)}.count{font-size:.72rem}.paper{padding:16px}}@media(max-width:390px){.paint{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style></head><body><header><div><span class="brand">🔎 Die Logical-Werkstatt</span><span class="count" id="count"></span></div></header><main><section id="home"><div class="hero"><div><div class="meta">Deine Knobelzeit beginnt!</div><h1>Lesen. Denken.<br>Rätsel lösen.</h1><p>Ein Logical ist ein Rätsel mit Hinweisen. Lies sie aufmerksam, kombiniere die Informationen und finde die einzige richtige Lösung. Du darfst jedes Rätsel auswählen!</p></div><div class="art" aria-hidden="true">🦊 ❄️</div></div><h2>Wähle deine Knobelstufe</h2><div class="levels" id="levels"></div></section><section id="game" hidden><button class="back" id="back">← Zur Rätselübersicht</button><div class="paper" id="paper"></div></section></main><script>
'use strict';
// Neue Rätsel können in dieser zentralen Liste ergänzt werden.
// 'answer' ist bei match: Ziel->Wert, bei color: Objekt->Farbe, bei place: Name->Platznummer.
const puzzles=[
{id:'h1',level:1,title:'Im Herbstwald',topic:'Herbst',type:'match',intro:'Drei Tiere haben sich einen Platz ausgesucht. Welches Tier ist wo?',targets:['Igel','Eichhörnchen','Fuchs'],options:['Laubhaufen','Baumhöhle','Waldrand'],clues:['Der Igel schläft unter einem Laubhaufen.','Das Eichhörnchen sitzt in einer Baumhöhle.','Der Fuchs ist weder unter dem Laub noch in der Baumhöhle.'],answer:{Igel:'Laubhaufen',Eichhörnchen:'Baumhöhle',Fuchs:'Waldrand'},hints:['Beginne mit dem Igel. Sein Platz steht direkt in einem Hinweis.','Schau nun auf den Hinweis zum Eichhörnchen.']},
{id:'h2',level:1,title:'Die bunten Schulranzen',topic:'Schule',type:'color',intro:'Drei Kinder haben verschiedenfarbige Ranzen. Färbe jeden Ranzen passend ein.',objects:['Mia','Leon','Emil'],shape:'bag',options:['Rot','Blau','Grün'],clues:['Leons Ranzen ist grün.','Mias Ranzen ist nicht blau.','Emil hat keinen roten Ranzen.'],answer:{Mia:'Rot',Leon:'Grün',Emil:'Blau'},hints:['Färbe zuerst Leons Ranzen.','Welche Farben bleiben für Mia und Emil übrig?']},
{id:'h3',level:1,title:'Geschenke für die Wichtel',topic:'Weihnachten',type:'match',intro:'Jeder Wichtel bekommt ein anderes Geschenk. Wer bekommt was?',targets:['Pippa','Matti','Toni'],options:['Teddybär','Stern','Trommel'],clues:['Pippa bekommt den kuscheligen Teddybären.','Toni bekommt ein Musikinstrument.','Matti bekommt keine Trommel.'],answer:{Pippa:'Teddybär',Matti:'Stern',Toni:'Trommel'},hints:['Was ist ein Musikinstrument?','Zwei Geschenke sind nun schon vergeben.']},
{id:'h4',level:2,title:'Das Drachenfest',topic:'Herbst',type:'place',intro:'Vier Kinder stehen in einer Reihe. Setze sie von links nach rechts auf die richtigen Plätze.',names:['Lina','Ben','Maja','Oskar'],clues:['Ben steht ganz rechts.','Lina steht direkt links neben Maja.','Oskar steht ganz links.'],answer:{Oskar:1,Lina:2,Maja:3,Ben:4},hints:['Beginne mit den beiden äußeren Plätzen.','Lina steht unmittelbar vor Maja.']},
{id:'h5',level:2,title:'Tiere im Winter',topic:'Natur',type:'match',intro:'Jedes Tier kommt auf andere Weise durch den Winter. Ordne die Beschreibungen zu.',targets:['Igel','Eichhörnchen','Reh'],options:['hält Winterschlaf','nutzt versteckte Vorräte','sucht im Winter Nahrung'],clues:['Der Igel hält Winterschlaf.','Das Eichhörnchen frisst auch seine versteckten Nüsse.','Das Reh hält keinen Winterschlaf und legt keine Nussvorräte an.'],answer:{Igel:'hält Winterschlaf',Eichhörnchen:'nutzt versteckte Vorräte',Reh:'sucht im Winter Nahrung'},hints:['Was macht der Igel?','Überlege, welches Tier Nüsse versteckt.']},
{id:'h6',level:2,title:'Die Weihnachtsmarktbuden',topic:'Weihnachten',type:'color',intro:'Die drei Buden bekommen unterschiedliche Farben. Färbe sie passend ein.',objects:['Sternenbude','Plätzchenbude','Spielzeugbude'],shape:'house',options:['Gelb','Rot','Blau'],clues:['Die Sternenbude ist gelb.','Die Plätzchenbude ist nicht blau.','Die Spielzeugbude ist nicht rot.'],answer:{Sternenbude:'Gelb',Plätzchenbude:'Rot',Spielzeugbude:'Blau'},hints:['Die erste Bude hat ihre Farbe schon.','Für die anderen beiden bleiben Rot und Blau.']},
{id:'h7',level:3,title:'Hobbys am Nachmittag',topic:'Freizeit',type:'match',intro:'Vier Kinder haben unterschiedliche Hobbys. Finde heraus, was jedes Kind macht.',targets:['Nora','Paul','Sami','Ella'],options:['lesen','Fußball','malen','Puzzle'],clues:['Paul spielt mit einem Ball.','Ella malt nicht und liest nicht. Sie mag keine Ballspiele.','Nora spielt nicht Fußball und setzt kein Puzzle zusammen. Sie benutzt heute keine Farben.','Sami liest nicht.'],answer:{Nora:'lesen',Paul:'Fußball',Sami:'malen',Ella:'Puzzle'},hints:['Paul und Ella kannst du zuerst zuordnen.','Welche Möglichkeiten bleiben für Nora?']},
{id:'h8',level:3,title:'Spuren im Schnee',topic:'Winter',type:'place',intro:'Vier Tiere stehen nebeneinander. Finde ihre Reihenfolge von links nach rechts.',names:['Hase','Fuchs','Reh','Eule'],clues:['Die Eule steht auf Platz 1.','Der Hase steht direkt rechts von der Eule.','Der Fuchs steht nicht ganz rechts.','Das Reh steht rechts vom Fuchs.'],answer:{Eule:1,Hase:2,Fuchs:3,Reh:4},hints:['Setze Eule und Hase zuerst.','Für Fuchs und Reh sind noch zwei Plätze frei.']},
{id:'h9',level:3,title:'Die Plätzchendosen',topic:'Weihnachten',type:'color',intro:'Drei Dosen sollen unterschiedliche Farben bekommen. Färbe sie anhand der Hinweise ein.',objects:['Sternendose','Herzdose','Monddose'],shape:'tin',options:['Lila','Gold','Türkis'],clues:['Die Sternendose ist weder lila noch türkis.','Die Herzdose ist nicht gold.','Die Monddose ist nicht türkis.'],answer:{Sternendose:'Gold',Herzdose:'Türkis',Monddose:'Lila'},hints:['Welche Farbe bleibt für die Sternendose?','Vergleiche danach die beiden anderen Hinweise.']},
{id:'h10',level:4,title:'Die Sitzbank',topic:'Schule',type:'place',intro:'Vier Kinder sitzen nebeneinander. Finde ihre genaue Reihenfolge von links nach rechts.',names:['Mila','Jonas','Aylin','Theo'],clues:['Jonas sitzt ganz rechts.','Theo sitzt direkt rechts neben Mila.','Mila sitzt links von Aylin, aber nicht direkt neben ihr.','Aylin sitzt nicht auf Platz 2.'],answer:{Mila:1,Theo:2,Aylin:3,Jonas:4},hints:['Jonas sitzt auf Platz 4.','Zwischen Mila und Aylin muss mindestens ein Platz liegen.']},
{id:'h11',level:4,title:'Vier Tiere, vier Namen',topic:'Tiere',type:'match',intro:'Vier Tiere bekommen unterschiedliche Namen. Wer heißt wie?',targets:['Katze','Hund','Kaninchen','Papagei'],options:['Flocke','Keks','Pünktchen','Rudi'],clues:['Der Hund heißt Rudi.','Das Kaninchen heißt Flocke.','Die Katze heißt weder Flocke noch Pünktchen.','Der Papagei heißt nicht Keks.'],answer:{Katze:'Keks',Hund:'Rudi',Kaninchen:'Flocke',Papagei:'Pünktchen'},hints:['Zwei Tiere haben schon einen festen Namen.','Welche beiden Namen sind für Katze und Papagei noch frei?']},
{id:'h12',level:4,title:'Die Wichtelwerkstatt',topic:'Weihnachten',type:'match',intro:'Vier Wichtel haben vier verschiedene Aufgaben. Finde heraus, wer was erledigt.',targets:['Lotti','Knut','Fine','Ole'],options:['Schleifen binden','Geschenke einpacken','Karten schreiben','Pakete stapeln'],clues:['Lotti packt keine Geschenke ein und bindet keine Schleifen.','Knut stapelt Pakete.','Fine schreibt keine Karten und bindet keine Schleifen.','Ole packt keine Geschenke ein und stapelt keine Pakete.','Ole schreibt keine Karten.'],answer:{Lotti:'Karten schreiben',Knut:'Pakete stapeln',Fine:'Geschenke einpacken',Ole:'Schleifen binden'},hints:['Beginne mit Knut.','Was bleibt für Lotti übrig, wenn du ihre drei Ausschlüsse beachtest?']}
];
// In jedem Puzzle muss genau eine Kombination alle Hinweise erfüllen.
const levelNames=['Einsteiger','Knobler','Denksportler','Logikprofis'];
const levelDescs=['Erste Hinweise verstehen','Mehrere Hinweise verbinden','Mit Ausschlüssen knobeln','Knifflige Kombinationen lösen'];
const palette={Rot:'#e76f67',Blau:'#6395cf',Grün:'#69a77d',Gelb:'#f1c95a',Lila:'#9c82c7',Gold:'#e0b44e',Türkis:'#56b5ad'};
const store='logicalWerkstatt2026_v1';let progress={};try{progress=JSON.parse(localStorage.getItem(store)||'{}')}catch(e){};
let current=null,attempts=0,tipIndex=0,selected=null,positions={},colors={};
const el=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(store,JSON.stringify(progress))}catch(e){}}
function stars(n){return '★'.repeat(n)+'☆'.repeat(3-n)}
function updateCount(){el('count').textContent=`${Object.keys(progress).filter(k=>progress[k]>0).length} von ${puzzles.length} gelöst`}
function home(){current=null;el('home').hidden=false;el('game').hidden=true;updateCount();el('levels').innerHTML=levelNames.map((name,i)=>`<article class="level"><div class="level-head"><h3>${name}</h3><span class="level-num">${i+1}</span></div><p>${levelDescs[i]}</p>${puzzles.filter(p=>p.level===i+1).map(p=>`<button class="task" data-open="${p.id}"><span><strong>${esc(p.title)}</strong><small>${esc(p.topic)} · ${p.type==='match'?'Zuordnen':p.type==='color'?'Anmalen':'Platzieren'}</small></span><span class="stars">${stars(progress[p.id]||0)}</span></button>`).join('')}</article>`).join('');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openPuzzle(b.dataset.open));}
function openPuzzle(id){current=puzzles.find(p=>p.id===id);attempts=0;tipIndex=0;selected=null;positions={};colors={};el('home').hidden=true;el('game').hidden=false;render();scrollTo(0,0)}
function picture(shape,color){const fill=color||'#fff';const outline='#536b70';if(shape==='bag')return `<svg class="paint-svg" viewBox="0 0 130 100" aria-hidden="true"><path d="M46 28 Q46 8 65 8 Q84 8 84 28" stroke="${outline}" stroke-width="6" fill="none"/><rect x="28" y="26" width="74" height="68" rx="13" fill="${fill}" stroke="${outline}" stroke-width="3"/><rect x="43" y="59" width="44" height="25" rx="6" fill="${fill}" stroke="${outline}" stroke-width="3"/><path d="M44 41 H86" stroke="${outline}" stroke-width="3"/></svg>`;if(shape==='house')return `<svg class="paint-svg" viewBox="0 0 130 100" aria-hidden="true"><path d="M12 42 L65 8 L118 42" fill="${fill}" stroke="${outline}" stroke-width="3"/><rect x="23" y="42" width="84" height="53" fill="${fill}" stroke="${outline}" stroke-width="3"/><rect x="52" y="62" width="26" height="33" fill="#fff" stroke="${outline}" stroke-width="3"/><circle cx="72" cy="80" r="2" fill="${outline}"/></svg>`;return `<svg class="paint-svg" viewBox="0 0 130 100" aria-hidden="true"><ellipse cx="65" cy="22" rx="43" ry="12" fill="${fill}" stroke="${outline}" stroke-width="3"/><path d="M22 22 V77 Q22 94 65 94 Q108 94 108 77 V22" fill="${fill}" stroke="${outline}" stroke-width="3"/><ellipse cx="65" cy="77" rx="43" ry="12" fill="none" stroke="${outline}" stroke-width="2"/></svg>`}
function render(){const p=current;const content=p.type==='match'?`<h3>Was gehört zusammen?</h3>${p.targets.map((name,i)=>`<div class="row"><label for="s${i}">${esc(name)}</label><select id="s${i}" data-key="${esc(name)}"><option value="">Bitte wählen …</option>${p.options.map(o=>`<option>${esc(o)}</option>`).join('')}</select></div>`).join('')}`:p.type==='color'?`<h3>Male mit einem Fingertipp</h3><p class="hint">Wähle zuerst eine Farbe und tippe dann auf ein Bild. Tippe erneut, um die Farbe zu ändern.</p><div class="palette">${p.options.map(o=>`<button class="swatch" data-color="${esc(o)}" style="background:${palette[o]}">${esc(o)}</button>`).join('')}</div><div class="paint">${p.objects.map((o,i)=>`<div class="paint-cell"><button class="paint-target" data-object="${esc(o)}" aria-label="${esc(o)} anmalen">${picture(p.shape,null)}</button><strong>${esc(o)}</strong><span id="paintlabel${i}" class="hint">Noch nicht angemalt</span></div>`).join('')}</div>`:`<h3>Wer steht wo?</h3><p class="hint">Tippe zuerst auf einen Namen, dann auf den passenden Platz. Du kannst die Namen jederzeit umsetzen.</p><div class="places">${[1,2,3,4].map(n=>`<button class="place" data-place="${n}"><small>Platz ${n}</small><span id="place${n}">frei</span></button>`).join('')}</div><div class="tokens">${p.names.map(n=>`<button class="token" data-name="${esc(n)}">${esc(n)}</button>`).join('')}</div>`;
el('paper').innerHTML=`<div class="meta">Stufe ${p.level} · ${esc(p.topic)}</div><h1>${esc(p.title)}</h1><p class="intro">${esc(p.intro)}</p><div class="columns"><div class="clues"><h3>🔍 Deine Hinweise</h3><ol>${p.clues.map((c,i)=>`<li id="clue${i}">${esc(c)}</li>`).join('')}</ol></div><div class="work">${content}</div></div><div class="actions"><button class="primary" id="check">Lösung überprüfen</button><button class="secondary" id="tip">💡 Tipp</button><button class="secondary" id="restart">Neu beginnen</button></div><div id="feedback" role="status" aria-live="polite"></div>`;
el('check').onclick=check;el('tip').onclick=hint;el('restart').onclick=()=>{attempts=0;tipIndex=0;selected=null;positions={};colors={};render()};if(p.type==='place')setupPlaces();if(p.type==='color')setupColors();}
function feedback(message,kind='bad'){el('feedback').innerHTML=`<div class="feedback ${kind}">${esc(message)}</div>`}
function setupPlaces(){document.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>{selected=b.dataset.name;refreshPlaces()});document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{if(!selected){feedback('Wähle zuerst einen Namen aus.');return}for(const k in positions)if(positions[k]===selected)delete positions[k];positions[b.dataset.place]=selected;selected=null;refreshPlaces();el('feedback').innerHTML=''});refreshPlaces()}
function refreshPlaces(){for(let i=1;i<=4;i++)el('place'+i).textContent=positions[i]||'frei';document.querySelectorAll('[data-name]').forEach(b=>{b.classList.toggle('active',selected===b.dataset.name);b.classList.toggle('used',Object.values(positions).includes(b.dataset.name))})}
function setupColors(){document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{selected=b.dataset.color;document.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('active',x.dataset.color===selected))});document.querySelectorAll('[data-object]').forEach((b,i)=>b.onclick=()=>{if(!selected){feedback('Wähle zuerst eine Farbe aus.');return}colors[b.dataset.object]=selected;b.innerHTML=picture(current.shape,palette[selected]);el('paintlabel'+i).textContent=selected;el('feedback').innerHTML=''})}
function hint(){const p=current;const i=tipIndex%p.hints.length;document.querySelectorAll('.clues li').forEach((li,j)=>li.classList.toggle('emph',j===i));feedback('💡 '+p.hints[i]);tipIndex++}
function check(){const p=current;let correct=false,filled=false;if(p.type==='match'){const fields=[...document.querySelectorAll('[data-key]')];const vals=fields.map(f=>f.value);filled=vals.every(Boolean);if(filled&&new Set(vals).size!==vals.length){feedback('Jede Antwort darf nur einmal vorkommen. Prüfe deine Zuordnungen.');return}correct=filled&&fields.every(f=>f.value===p.answer[f.dataset.key]);}else if(p.type==='color'){filled=p.objects.every(o=>!!colors[o]);if(filled&&new Set(Object.values(colors)).size!==p.objects.length){feedback('Jede Farbe wird nur einmal verwendet.');return}correct=filled&&p.objects.every(o=>colors[o]===p.answer[o]);}else{filled=Object.keys(positions).length===p.names.length;correct=filled&&p.names.every(n=>positions[p.answer[n]]===n)}if(!filled){feedback('Du hast noch nicht alles ausgefüllt. Schau noch einmal genau hin.');return}attempts++;if(!correct){feedback('Noch nicht ganz richtig. Lies die Hinweise erneut und probiere es noch einmal!');return}const earned=attempts===1?3:attempts===2?2:1;progress[p.id]=Math.max(progress[p.id]||0,earned);save();updateCount();el('paper').innerHTML=`<div class="win"><div class="big">${'★'.repeat(earned)}${'☆'.repeat(3-earned)}</div><div class="meta">Geschafft!</div><h2>${earned===3?'Hervorragend geknobelt!':earned===2?'Gut kombiniert!':'Super durchgehalten!'}</h2><p>Du hast <strong>${esc(p.title)}</strong> gelöst und ${earned} ${earned===1?'Stern':'Sterne'} verdient!</p><div class="actions" style="justify-content:center"><button class="primary" id="next">Weiterknobeln</button><button class="secondary" id="overview">Zur Übersicht</button></div></div>`;el('overview').onclick=home;el('next').onclick=()=>{const next=puzzles.find(x=>!progress[x.id]);next?openPuzzle(next.id):home()}}
el('back').onclick=home;home();
</script></body></html>
