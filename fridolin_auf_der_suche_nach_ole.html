'use strict';const places={"1": "Felsenhöhle", "2": "Schiffswrack", "3": "Perlenmuschel", "4": "Meeresschildkröte", "5": "Sandburg", "6": "Steinbogen", "7": "Leuchtturm", "8": "Krabbe", "9": "Schatztruhe"};const route=[5, 2, 3, 4, 6, 8, 9, 7, 1];const stories={"1": {"5": "Fridolin ist bei der Sandburg. Ole ist weg! Ein Fisch sagt: „Ole war bei dem alten Schiff aus Holz.“ Suche das Schiff.", "2": "Fridolin schwimmt zum alten Schiff. Es liegt schief im Sand. Dort sieht er eine Spur aus kleinen Blasen. „Ole war hier!“, ruft er. Nun suche die große Muschel mit der Perle.", "3": "In der Muschel liegt eine helle Perle. Daneben steht im Sand: „Frag das Tier mit dem grünen Panzer.“ Wer ist gemeint?", "4": "Die Schildkröte nickt. „Ole ist zum großen Bogen aus Stein geschwommen.“ Suche den Steinbogen.", "6": "Unter dem Steinbogen liegt eine rote Schere. „Die gehört meiner Freundin!“, ruft ein kleiner Fisch. Suche die rote Krabbe.", "8": "Die Krabbe zeigt auf den Sand. „Ole hat etwas Glänzendes gesucht. Geh zur offenen Truhe mit den Goldmünzen.“", "9": "In der Schatztruhe liegt ein Zettel: „Suche das hohe Haus mit dem roten Dach und dem Licht.“ Schwimme dorthin.", "7": "Am Leuchtturm findet Fridolin eine Spur aus Muscheln. Sie führt zur dunklen Höhle im Felsen. Suche die Höhle.", "1": "„Ole!“, ruft Fridolin. Aus der Höhle winken acht Arme. Ole hat sich hier versteckt, um Fridolin zu überraschen. Geschafft!"}, "2": {"5": "An der Sandburg sucht Fridolin nach Ole. Ein Clownfisch berichtet, dass Ole zuletzt ein altes Holzschiff untersucht hat. Es liegt schräg auf dem Meeresboden. Welchen Ort besucht Fridolin als Nächstes?", "2": "Zwischen den Planken des Schiffswracks entdeckt Fridolin eine kleine Zeichnung. Darauf ist keine Schatztruhe zu sehen, sondern eine geöffnete Muschel mit etwas Rundem und Weißem darin. Suche diesen Ort.", "3": "Neben der Perle liegen drei Spuren im Sand. Eine führt zu einem Tier, das sein Haus immer auf dem Rücken trägt. Fridolin folgt genau dieser Spur. Wo muss er hin?", "4": "Die Schildkröte hat Ole gesehen. „Er schwamm nicht zum Leuchtturm“, erklärt sie. „Er tauchte durch einen Bogen, den das Meer aus Felsen geformt hat.“ Finde diesen Durchgang.", "6": "Im Schatten des Steinbogens liegt eine kleine rote Schere. Fridolin weiß: Sie gehört einem Tier mit zwei kräftigen Scheren und vielen Beinen. Suche dieses Tier auf der Karte.", "8": "Die Krabbe erzählt: „Ole fragte mich nach etwas Wertvollem. Ich zeigte ihm einen Kasten, dessen Deckel offen steht. Darin glänzt es golden.“ Wohin schwimmt Fridolin?", "9": "Zwischen den Münzen entdeckt Fridolin eine Nachricht von Ole: „Ich bin zu einem hohen Turm geschwommen. Sein Licht zeigt Schiffen den Weg.“ Suche diesen Turm.", "7": "Beim Leuchtturm entdeckt Fridolin eine Reihe kleiner Muscheln. Sie führt nicht zum Schiff und nicht zum Steinbogen, sondern zu einem dunklen Eingang im Felsen. Folge der Spur.", "1": "Hinter dem Höhleneingang wartet Ole. Er wollte für Fridolin eine Überraschung vorbereiten. Beide lachen und schwimmen gemeinsam zurück. Du hast Ole gefunden!"}, "3": {"5": "Fridolin entdeckt an der Sandburg eine Nachricht im feuchten Sand: „Ole untersuchte etwas, das früher über das Meer fuhr, heute aber zwischen Wasserpflanzen auf dem Grund liegt.“ Fridolin vergleicht die Orte auf der Karte. Wo beginnt seine Suche?", "2": "Das Wrack ist verlassen, doch unter einer losen Planke steckt ein Bild. Es zeigt eine runde Kostbarkeit, die von zwei gewölbten Schalen geschützt wird. Obwohl in der Nähe eine Truhe voller Gold liegt, weist das Bild an einen anderen Ort. Welchen?", "3": "An der Perlenmuschel entdeckt Fridolin eine ungewöhnlich breite Spur. Ein Seepferdchen erklärt: „Das gesuchte Tier schwimmt langsam und kann seinen schützenden Panzer nicht ablegen.“ Welches Tier passt zu dieser Beschreibung?", "4": "Die Schildkröte erinnert sich genau: Ole suchte einen Durchgang, unter dem man hindurchschwimmen kann, ohne eine Höhle zu betreten. Er besteht vollständig aus Fels und ist auf beiden Seiten offen. Finde den passenden Ort.", "6": "Unter dem Steinbogen findet Fridolin eine rote Scherenspitze. Der Clownfisch vermutet zunächst, sie gehöre einem Hummer. Doch auf der Karte lebt hier nur ein kleines rotes Tier mit zwei Scheren, das seitwärts läuft. Wen sollte Fridolin befragen?", "8": "Die Krabbe berichtet, Ole habe nach einer alten Sammlung gesucht. „Sie liegt weder im gestrandeten Schiff noch in der Muschel“, erklärt sie. „Ihr hölzerner Deckel steht offen, und Münzen funkeln darin.“ Welcher Ort ist gemeint?", "9": "In der Truhe findet Fridolin statt Ole eine zusammengerollte Botschaft. Darauf steht: „Mein nächster Halt steht auf einem Felsen. Sein Licht hilft den Schiffen, selbst wenn es dunkel wird.“ Fridolin muss nun das passende Bauwerk finden.", "7": "Der Leuchtturmwärter hat Ole nicht gesehen. Doch Fridolin entdeckt eine Muschelspur, die an der Küste entlang zu einem schattigen Felseneingang führt. Das offene Felsentor in der Mitte der Karte ist es nicht. Wo endet die Spur?", "1": "Als Fridolin die Felsenhöhle erreicht, taucht Ole mit einem breiten Lächeln auf. Er hat heimlich eine kleine Überraschung vorbereitet. Fridolin ist erleichtert – und du hast alle Hinweise richtig kombiniert!"}, "4": {"5": "Fridolin wartet vergeblich an der Sandburg auf seinen Freund Ole. Ein Clownfisch hat beobachtet, wie der Oktopus ein Bauwerk untersuchte, das einst Menschen über das Wasser trug. Inzwischen liegt es verlassen auf dem Meeresgrund; weder ist es aus Stein gebaut noch leuchtet es Schiffen den Weg. Welcher Ort passt zu dieser Beschreibung?", "2": "Im Inneren des verfallenen Schiffs entdeckt Fridolin eine eingeritzte Skizze: Zwei schalenförmige Hälften umschließen einen einzigen hellen, runden Gegenstand. Zwar könnte Ole auch die nahe Schatztruhe besucht haben, doch die Zeichnung verweist ausdrücklich nicht auf Münzen. Welchen Ort sollte Fridolin aufsuchen?", "3": "Bei der geöffneten Muschel liegt ein Hinweis: „Suche die Bewohnerin, deren Schutz sie auf jedem Weg begleitet. Sie muss ihn nicht erst aufsuchen, denn er ist fest mit ihrem Körper verbunden.“ Fridolin denkt kurz an den Krebs mit seinen harten Scheren, erkennt dann aber, dass ein anderes Tier gemeint ist. Welches?", "4": "Die Schildkröte berichtet, Ole habe nach einem natürlichen Durchgang gesucht. Er sei weder in einem abgeschlossenen Felsenraum verschwunden noch durch ein von Menschen gebautes Tor geschwommen. Vielmehr habe er einen frei stehenden, beidseitig offenen Felsdurchlass gewählt. Wohin führt diese Aussage?", "6": "Am Durchgang entdeckt Fridolin ein abgebrochenes Stück einer roten Schere. Ein Fisch erklärt, die Besitzerin bewege sich häufig seitwärts und habe zwei Scheren, mit denen sie Nahrung festhalten könne. Die Spur führt also weder zu einem Tier mit Panzer noch zu einem mit acht Armen. Wen sucht Fridolin?", "8": "Die Krabbe erinnert sich an Oles Frage nach einem Behälter mit wertvollem Inhalt. „Er meinte nicht die Muschel, obwohl sie eine Kostbarkeit schützt“, sagt sie. „Gesucht war ein von Menschen gebauter Holzkasten, dessen Inhalt offen sichtbar im Sand glänzt.“ Welcher Ort erfüllt beide Bedingungen?", "9": "Unter den Goldmünzen liegt ein wasserdichter Zettel. Ole schreibt, sein nächstes Ziel sei ein schmales, hohes Gebäude auf felsigem Grund gewesen. Entscheidend sei nicht dessen Größe, sondern seine Aufgabe: Es soll Seefahrenden bei der Orientierung helfen. Welches Bauwerk kommt infrage?", "7": "Am Fuß des Turms entdeckt Fridolin Muscheln, die Ole in regelmäßigen Abständen abgelegt hat. Ihre Spur führt zu einer dunklen Öffnung in einer massiven Felswand. Der ebenfalls steinerne Durchgang mitten im Riff scheidet aus, denn er besitzt keine geschlossene Rückwand. Welches Ziel bleibt?", "1": "Hinter der Felswand wartet Ole tatsächlich auf Fridolin. Er wollte seinen Freund mit einer selbst gebastelten Muschelkette überraschen und hatte die Spur als Rätsel angelegt. Fridolin freut sich über das Wiedersehen – und über deine sorgfältige Spurensuche!"}};const intros={"1": "Ole ist weg! Hilf Fridolin. Lies den Text und tippe auf den richtigen Ort.", "2": "Ole ist verschwunden! Lies jeden Hinweis aufmerksam und finde den nächsten Ort.", "3": "Eine geheimnisvolle Spur führt durch das Riff. Kombiniere die Hinweise und finde Ole.", "4": "Fridolin folgt einer rätselhaften Fährte. Unterscheide wichtige Details von Ablenkungen und erschließe den richtigen Weg."};const positions={"1": [15.4, 24.2], "2": [43.8, 27.8], "3": [70.0, 26.2], "4": [88.5, 42], "5": [24.0, 56.7], "6": [53.1, 55.4], "7": [85.4, 80.4], "8": [60.0, 89.6], "9": [35.4, 89.6]};let level=1,step=0,errors=0,locked=false;const $=id=>document.getElementById(id);const map=$('map');const buttons=new Map();for(const [id,p] of Object.entries(positions)){const b=document.createElement('button');b.className='spot';b.textContent=id;b.style.left=p[0]+'%';b.style.top=p[1]+'%';b.setAttribute('aria-label','Ort '+id+': '+places[id]);b.title='Ort '+id;b.addEventListener('click',()=>choose(Number(id)));map.append(b);buttons.set(Number(id),b)}
function render(){const at=route[step],finished=step===route.length-1;document.querySelectorAll('.level').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.level)===level)));$('stage').textContent=finished?'🎉 Ziel erreicht':step===0?'Dein Abenteuer beginnt':'Station '+(step+1)+' von 9';$('place').textContent=finished?'Ole ist gefunden!':step===0?'Fridolin braucht deine Hilfe':places[at];$('story').textContent=(step===0?intros[level]+'\n\n':'')+stories[level][at];$('story').classList.toggle('easy',level===1);$('tip').style.display=finished?'none':'block';$('counter').textContent=finished?'Alle Spuren gefunden!':'Fortschritt: '+step+' von 8 Wegen';$('fill').style.width=(step/8*100)+'%';$('progress').setAttribute('aria-valuenow',step);for(const [id,b] of buttons){b.classList.toggle('current',id===at);b.classList.toggle('done',route.slice(0,step).includes(id));b.disabled=finished;b.setAttribute('aria-current',id===at?'step':'false')}if(finished){$('feedback').textContent='🌟 Großartig! Du hast Fridolin geholfen, Ole wiederzufinden.';$('feedback').className='feedback good'}}
function choose(id){if(locked||step===route.length-1)return;const expected=route[step+1];if(id===expected){step++;errors=0;$('feedback').textContent=step===route.length-1?'':'Prima entdeckt! Lies jetzt den nächsten Hinweis.';$('feedback').className='feedback good';render();return}errors++;$('feedback').className='feedback';$('feedback').textContent=id===route[step]?'Hier bist du gerade. Suche den Ort, den der Hinweis beschreibt.':errors<3?'Noch nicht ganz! Lies den Hinweis noch einmal aufmerksam.':'Schau dir die wichtigen Merkmale im Text an und vergleiche sie mit der Karte. Du schaffst das!'}
document.querySelectorAll('.level').forEach(b=>b.addEventListener('click',()=>{level=Number(b.dataset.level);$('feedback').textContent='';$('feedback').className='feedback';render()}));$('restart').addEventListener('click',()=>{step=0;errors=0;locked=false;$('feedback').textContent='';$('feedback').className='feedback';render()});render();
</script></body></html>
